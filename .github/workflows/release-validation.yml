name: Release Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js-audio:
    name: Audio JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all web JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Run Audio Editor unit and contract tests
        run: npm run test:audio

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
