name: Release Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js-release:
    name: JS release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all web JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
      - name: Run Audio Editor unit and contract tests
        run: npm run test:audio
      - name: Run Semantic Studio unit and contract tests
        run: npm run test:semantic

  python-release:
    name: Python release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run schema and lightweight VST3 tests
        run: >-
          python -m pytest -q
          tests/test_audio_edit_project.py
          tests/test_semantic_project.py
          tests/test_vst3_scan.py
          tests/test_vst3_install.py
          tests/test_vst3_window.py

  windows-vst-window:
    name: Windows native VST window tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile native-window helper
        run: python -m compileall -q vst3_window.py vst3_editor_process.py vst3_install.py
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate Win32 bindings and helper lifecycle
        run: python -m pytest -q tests/test_vst3_window.py tests/test_vst3_install.py
