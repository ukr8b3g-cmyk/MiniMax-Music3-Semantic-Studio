name: Release Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js-audio:
    name: Audio JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release JavaScript syntax
        run: |
          node --check web/audio_draft_core.js
          node --check web/audio_empty_editor.js
          node --check web/audio_panels.js
          node --check web/audio_single_pipeline.js
          node --check web/node_compact.js
          node --check web/vst3_extension.js
          node --check web/vst3_preset_store.js
          node --check web/vst3_release_browser.js
          node --check web/zz_audio_effects_foundation.js
          node --check web/zz_audio_phase2d_chrome.js
          node --check web/zz_audio_phase2d_style.js
      - name: Run Audio Editor unit and contract tests
        run: npm run test:audio

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
