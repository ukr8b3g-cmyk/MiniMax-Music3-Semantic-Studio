name: V2.1-B validation

on:
  push:
    branches:
      - v2.1b-basic-dsp-loop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Python tests
        run: python -m pytest
      - name: Python compile check
        run: python -m compileall -q .
      - name: Frontend syntax checks
        run: |
          node --check web/audio_draft_core.js
          node --check web/audio_effects_core.js
          node --check web/audio_effects_dsp.js
          node --check web/audio_playback_loop.js
          node --check web/zz_audio_dsp_ui.js
      - name: Audio JS tests
        run: npm run test:audio
